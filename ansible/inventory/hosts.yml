# Static seed — overwritten by scripts/terraform-to-ansible.sh after each apply.
# To regenerate: bash scripts/terraform-to-ansible.sh

all:
  vars:
    aws_region: us-east-1

  children:
    eks:
      hosts:
        eks_cluster:
          ansible_connection: local
          eks_cluster_name: healthcare-ai-eks
          eks_cluster_endpoint: ""          # populated by terraform-to-ansible.sh

    ecr:
      hosts:
        ecr_registry:
          ansible_connection: local
          ecr_repository_url: ""            # populated by terraform-to-ansible.sh

    storage:
      hosts:
        worm_bucket:
          ansible_connection: local
          s3_worm_bucket: ""
          dynamodb_audit_table: ""

    search:
      hosts:
        opensearch:
          ansible_connection: local
          opensearch_endpoint: ""
