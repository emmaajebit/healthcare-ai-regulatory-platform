# group_vars/all.yml — Static defaults and Secrets Manager ARN references.
# Actual secret values are NEVER stored here; they are fetched at playbook
# runtime via the amazon.aws.secretsmanager_secret lookup using the ARNs below.
#
# This file is overwritten by scripts/terraform-to-ansible.sh after each
# terraform apply. The ARNs below are seeds for local development.
#
# To encrypt with ansible-vault:
#   ansible-vault encrypt ansible/playbooks/group_vars/all.yml

# ── Infrastructure (populated by terraform-to-ansible.sh) ────────────────────
aws_region: "us-east-1"
eks_cluster_name: "healthcare-ai-eks"
ecr_repository_url: ""
opensearch_endpoint: ""
s3_worm_bucket: ""
dynamodb_audit_table: ""

# ── IAM / OIDC ────────────────────────────────────────────────────────────────
terraform_deployer_role_arn: ""   # set by terraform-to-ansible.sh
terraform_planner_role_arn: ""
secrets_reader_policy_arn: ""

# ── Secrets Manager ARNs ──────────────────────────────────────────────────────
# Values are fetched at runtime — example task:
#
#   - name: Read ArgoCD secret
#     ansible.builtin.set_fact:
#       argocd_secret: "{{ lookup('amazon.aws.secretsmanager_secret', argocd_secret_arn, region=aws_region) | from_json }}"
#     no_log: true

argocd_secret_arn: ""
app_secret_arn: ""
helm_repo_secret_arn: ""
grafana_secret_arn: ""
