[defaults]
inventory           = inventory/hosts.yml
# vault_password_file is passed only when .vault_password exists (see Makefile);
# hard-coding it here makes every run fail when the file is absent.
retry_files_enabled = False
forks               = 10
host_key_checking   = False
stdout_callback     = yaml

[privilege_escalation]
# All hosts are ansible_connection: local — never sudo on the control machine.
become = False
