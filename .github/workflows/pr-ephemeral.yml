name: PR Ephemeral Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  id-token: write    # OIDC for AWS auth (kubectl/helm against EKS)
  contents: read
  pull-requests: write  # post preview URL comment

env:
  AWS_REGION: us-east-1
  NS: pr-${{ github.event.number }}

jobs:
  # Opt-in: needs the AWS bootstrap AND a role whose OIDC trust allows
  # pull_request tokens (the deployer role trusts refs/heads/main only).
  # Set repo variables ENABLE_PR_PREVIEWS=true and PR_PREVIEW_ROLE_ARN.
  # Until then these jobs are skipped, not failed.
  deploy-ephemeral:
    if: github.event.action != 'closed' && vars.ENABLE_PR_PREVIEWS == 'true' && vars.PR_PREVIEW_ROLE_ARN != ''
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PR_PREVIEW_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name healthcare-ai-eks \
            --region ${{ env.AWS_REGION }}

      - name: Create ephemeral namespace
        run: |
          kubectl create namespace ${{ env.NS }} \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace ${{ env.NS }} \
            ephemeral=true pr=${{ github.event.number }} --overwrite

      - name: Apply zero-trust network policy
        run: |
          kubectl apply -f kubernetes/network-policies/default-deny.yaml \
            -n ${{ env.NS }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push PR image
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/healthcare-ai/java-healthcare-app"
          docker build -t "$IMAGE:pr-${{ github.event.number }}-${{ github.sha }}" .
          docker push "$IMAGE:pr-${{ github.event.number }}-${{ github.sha }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy app to ephemeral namespace
        run: |
          helm upgrade --install java-healthcare-app-${{ env.NS }} \
            kubernetes/helm/java-healthcare-app \
            --namespace ${{ env.NS }} \
            --set image.repository="$IMAGE" \
            --set image.tag=pr-${{ github.event.number }}-${{ github.sha }} \
            --wait --timeout 120s

      - name: Run integration tests
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=java-healthcare-app \
            -n ${{ env.NS }} \
            --timeout=120s

      - name: Post preview URL to PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview environment ready: http://pr-${{ github.event.number }}.preview.internal`
            })

  teardown-ephemeral:
    if: github.event.action == 'closed' && vars.ENABLE_PR_PREVIEWS == 'true' && vars.PR_PREVIEW_ROLE_ARN != ''
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PR_PREVIEW_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name healthcare-ai-eks \
            --region ${{ env.AWS_REGION }}

      - name: Delete ephemeral namespace
        run: kubectl delete namespace ${{ env.NS }} --ignore-not-found
