apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: aws-secrets
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "healthcare-ai/db-credentials"
        objectType: "secretsmanager"
      - objectName: "healthcare-ai/api-keys"
        objectType: "secretsmanager"
