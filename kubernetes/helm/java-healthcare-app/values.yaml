replicaCount: 2

image:
  repository: ""   # Set via CI: ECR_REGISTRY/java-healthcare-app
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "250m"
    memory: "256Mi"

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"

secretsStore:
  enabled: true
  secretProviderClassName: aws-secrets
